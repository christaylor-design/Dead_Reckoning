<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dead Reckoning: Zombie Survival</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body {
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }

        #help-icon {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 42px; 
            height: 42px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 21px;
            z-index: 20;
        }

        #ui-overlay, #instructions-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        #overlay-title {
            color: #f00;
            margin: 0;
            font-size: clamp(40px, 8vw, 120px); 
            line-height: 1.1;
        }

        #overlay-msg {
            color: #ccc;
            font-size: clamp(18px, 2.5vw, 32px);
            max-width: 90%;
            line-height: 1.4;
            margin: 20px 0;
        }

        #instructions-overlay {
            z-index: 150;
        }

        #instruction-img {
            max-width: 85%;
            max-height: 70%;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            border: 2px solid #444;
            cursor: pointer;
        }

        .zombie-font { font-family: 'Creepster', cursive; }
        
        .btn {
            padding: clamp(10px, 2vh, 20px) clamp(20px, 4vw, 50px);
            background: #900;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: clamp(16px, 2vw, 24px);
            transition: background 0.2s;
            margin: 5px;
        }

        .btn:hover { background: #b00; }

        .close-help { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            font-size: 50px; 
            color: #fff; 
            padding: 10px;
            z-index: 160;
            cursor: pointer;
        }

        #dev-tools {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2000;
            display: none; 
            flex-direction: column;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
        }
        .dev-btn {
            background: #444;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            text-transform: uppercase;
        }
        .dev-btn:hover { background: #030; }
    </style>
</head>
<body>

    <div id="dev-tools">
        <button class="dev-btn" onclick="devWin()">DEV: Win Mission</button>
        <button class="dev-btn" onclick="devAddScrap()">DEV: +5 Scrap</button>
        <button class="dev-btn" onclick="devResetSave()">DEV: Reset Save</button>
    </div>

    <div id="rotate-overlay">
        <div class="zombie-font" style="font-size: 60px; color: #f00; margin-bottom: 20px;">INCOMING THREAT</div>
        <p style="font-size: 24px;">Please rotate your device to <strong>LANDSCAPE</strong>.</p>
        <div style="font-size: 80px; margin-top: 20px;">📱🔄</div>
    </div>

    <div id="game-container">
        <div id="help-icon" onclick="toggleInstructions(true)">?</div>
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay">
            <h1 id="overlay-title" class="zombie-font">MISSION FAILED</h1>
            <p id="overlay-msg">The colony has fallen.</p>
            <div id="overlay-actions">
                <button class="btn" onclick="initGame()">Try Again</button>
                <button id="btn-return-base" class="btn" style="background:#444;" onclick="returnToBase()">Return to Base</button>
            </div>
        </div>

        <div id="instructions-overlay">
            <span class="close-help" onclick="toggleInstructions(false)">×</span>
            <img id="instruction-img" src="https://christaylor-design.github.io/Dead_Reckoning/assets/Instruction%20board.png" alt="Survival Guide" onclick="toggleInstructions(false)">
            <div style="margin-top: 30px;">
                <button class="btn" style="background: #444;" onclick="returnToBaseFromHelp()">Back to Base</button>
                <button class="btn" onclick="toggleInstructions(false)">Resume Scavenge</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('ui-overlay');
        const instructionsOverlay = document.getElementById('instructions-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        const UI_RES = { w: 2752, h: 1536 };

        const ASSETS = {
            bg: 'https://christaylor-design.github.io/Dead_Reckoning/assets/New%20background.png',
            cards: 'https://christaylor-design.github.io/Dead_Reckoning/Card%20board.png',
            runBtn: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Run%20Button.png',
            lvlScreen: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Compound%20Level%20Screen.png',
            pills: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Anti-Rad%20Pills.png',
            rat: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Wind-up%20Rat.png',
            axe: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Axe.png',
            armoured: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Armoured%20Zombie.png',
            blind: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Blind%20One.png',
            queen: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Queen%20Zombie.png',
            backswing: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Backswing.png',
            victory: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Victory%20Screen.png'
        };

        const state = {
            currentView: 'base', 
            baseLevel: 1,
            upgradePieces: 0,
            showUnlockOverlay: false,
            showDatabase: false,
            showVictoryScreen: false,
            pendingUnlock: null,
            revealStep: 0, 
            survivalStreak: 0,
            bestStreak: 0,
            isEndless: false,
            deck: [],
            scavengeArea: [null, null, null, null],
            inventory: [null, null],
            storage: null,
            pocket: null,
            playerHP: 20,
            shelterHP: 20,
            medsQuota: 0,
            medsTarget: 12,
            materialsQuota: 0,
            materialsTarget: 22,
            avoidsUsedThisHand: 0,
            runUsed: false,
            gameActive: false,
            draggingCard: null,
            dragOffset: { x: 0, y: 0 },
            mouse: { x: 0, y: 0 },
            imagesLoaded: false,
            logText: "Initialising compound systems...",
            logColor: "#0f0",
            radExposure: 3,
            pillsActive: false,
            isDevMode: false
        };

        const UI = {
            scavengeSlots: [
                { x: 903, y: 519, w: 216, h: 293 },
                { x: 1202, y: 519, w: 216, h: 293 },
                { x: 1501, y: 519, w: 216, h: 293 },
                { x: 1803, y: 519, w: 216, h: 293 }
            ],
            inventorySlots: [
                { x: 343, y: 949, w: 211, h: 287 },
                { x: 646, y: 949, w: 211, h: 287 }
            ],
            actionSlots: [
                { x: 1151, y: 983, w: 267, h: 363, type: 'scavenger' }, 
                { x: 1547, y: 983, w: 267, h: 363, type: 'avoid' }
            ],
            storageSlot: { x: 2197, y: 949, w: 211, h: 287 },
            fixShelterSlot: { x: 2327, y: 519, w: 211, h: 287 },
            pocketSlot: { x: 186, y: 519, w: 192, h: 261 },
            discardSlot: { x: 83, y: 80, w: 211, h: 287 }, 
            helpScreen: { x: 482, y: 510, w: 327, h: 331 },
            runBtn: { x: 2471, y: 73, w: 194, h: 96 },
            bars: {
                player: { x: 529, y: 243, w: 950, h: 141, color: '#4a1', val: 'playerHP', max: 20, label: 'HEALTH' },
                shelter: { x: 1608, y: 243, w: 950, h: 141, color: '#26a', val: 'shelterHP', max: 20, label: 'SHELTER' }
            },
            text: {
                deck: { x: 1662, y: 113, w: 121, h: 56 },
                meds: { x: 1976, y: 86, w: 113, h: 64 },
                materials: { x: 2255, y: 86, w: 113, h: 64 }
            },
            base: {
                startBtn: { x: 1100, y: 1300, w: 550, h: 150 },
                screen: { x: 2291, y: 988, w: 423, h: 485 },
                lvlNum: { x: 2500, y: 1148, w: 145, h: 72 },
                upgradeTxt: { x: 2500, y: 1242, w: 145, h: 72 },
                progressBar: { x: 2345, y: 1310, w: 310, h: 70 },
                unlockModal: { x: 476, y: 218, w: 1800, h: 1100 },
                databaseBtn: { x: 2291, y: 830, w: 423, h: 140 },
                victoryButtons: {
                    newCompound: { x: 476, y: 1250, w: 850, h: 180 },
                    endless: { x: 1426, y: 1250, w: 850, h: 180 }
                }
            }
        };

        const imgBg = new Image();
        const imgCards = new Image();
        const imgRunBtn = new Image();
        const imgLvlScreen = new Image();
        const imgPills = new Image();
        const imgRat = new Image();
        const imgAxe = new Image();
        const imgArmoured = new Image();
        const imgBlind = new Image();
        const imgQueen = new Image();
        const imgBackswing = new Image();
        const imgVictory = new Image();
        const baseImages = []; 
        let loadedCount = 0;

        function checkDevMode() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('dev')) {
                state.isDevMode = true;
                document.getElementById('dev-tools').style.display = 'flex';
            }
        }

        function saveProgression() {
            localStorage.setItem('dr_save_v1', JSON.stringify({ 
                level: state.baseLevel, 
                pieces: state.upgradePieces,
                best: state.bestStreak,
                endless: state.isEndless
            }));
        }

        function loadProgression() {
            const saved = localStorage.getItem('dr_save_v1');
            if (saved) {
                const data = JSON.parse(saved);
                state.baseLevel = data.level || 1;
                state.upgradePieces = data.pieces || 0;
                state.bestStreak = data.best || 0;
                state.isEndless = data.endless || false;
            }
        }

        function devWin() {
            if (!state.isDevMode) return;
            if (state.currentView !== 'game') { addLog("Enter mission first!", true); return; }
            state.medsQuota = state.medsTarget; state.materialsQuota = state.materialsTarget;
            state.deck = []; state.scavengeArea = [null, null, null, null];
            addLog("DEV: Force win triggered."); checkGameOver();
        }

        function devAddScrap() {
            if (!state.isDevMode) return;
            if (state.baseLevel === 7 && state.upgradePieces >= 10) return;
            state.upgradePieces += 5;
            if (state.upgradePieces >= 10 && state.baseLevel < 7) { 
                state.upgradePieces -= 10; 
                state.baseLevel++;
                state.pendingUnlock = state.baseLevel;
                state.revealStep = 0;
            } else if (state.baseLevel === 7 && state.upgradePieces >= 10) {
                state.upgradePieces = 10;
                state.showVictoryScreen = true;
            }
            saveProgression();
        }

        function devResetSave() { if (!state.isDevMode) return; state.baseLevel = 1; state.upgradePieces = 0; state.isEndless = false; state.survivalStreak = 0; saveProgression(); addLog("DEV: Reset."); }

        function isQueenPresent() { return state.scavengeArea.some(c => c && c.specialName === 'The Alpha Queen'); }

        function getZombiePower(card) {
            if (!card || (card.suit !== 'CLUBS' && !card.isSpecial)) return card?.power || 0;
            let p = card.power;
            if (isQueenPresent() && card.specialName !== 'The Alpha Queen') p += 3;
            return p;
        }

        function returnToBase() { 
            state.currentView = 'base'; 
            state.gameActive = false;
            uiOverlay.style.display = 'none'; 
            if (state.pendingUnlock && state.pendingUnlock > 1) {
                state.showUnlockOverlay = true;
                state.revealStep = 0;
            }
        }

        function returnToBaseFromHelp() {
            toggleInstructions(false);
            returnToBase();
            addLog("Mission aborted. Returned to compound.");
        }

        function addLog(msg, isError = false) { state.logText = msg; state.logColor = isError ? '#f33' : '#0f0'; }

        function toggleInstructions(show) { instructionsOverlay.style.display = show ? 'flex' : 'none'; }

        function createDeck() {
            const deck = [];
            const suits = ['HEARTS', 'CLUBS', 'SPADES', 'DIAMONDS'];
            suits.forEach(suit => {
                const maxRank = (suit === 'CLUBS') ? 13 : 9;
                for (let i = 1; i <= maxRank; i++) {
                    let card = { suit, value: i, power: i, isSpecial: false, specialName: '', id: 'c-' + Math.random(), distracted: false, usesLeft: 1 };
                    if (suit === 'HEARTS' && i === 1 && state.baseLevel >= 2) { card.isSpecial = true; card.specialName = 'Anti-rad Pills'; card.power = 0; card.asset = imgPills; }
                    if (suit === 'DIAMONDS' && i === 1 && state.baseLevel >= 3) { card.isSpecial = true; card.specialName = 'Wind-up Rat'; card.power = 0; card.asset = imgRat; }
                    if (suit === 'SPADES' && i === 1 && state.baseLevel >= 4) { card.isSpecial = true; card.specialName = 'The Axe'; card.power = 12; card.asset = imgAxe; }
                    if (suit === 'CLUBS' && i === 1 && state.baseLevel >= 4) { card.isSpecial = true; card.specialName = 'Armoured Zombie'; card.power = 15; card.asset = imgArmoured; }
                    if (suit === 'SPADES' && i === 2 && state.baseLevel >= 5) { card.isSpecial = true; card.specialName = 'Back Swing'; card.power = 0; card.asset = imgBackswing; }
                    if (suit === 'CLUBS' && i === 2 && state.baseLevel >= 6) { card.isSpecial = true; card.specialName = 'The Blind One'; card.power = 8; card.asset = imgBlind; }
                    if (suit === 'CLUBS' && i === 3 && state.baseLevel >= 7) { card.isSpecial = true; card.specialName = 'The Alpha Queen'; card.power = 10; card.asset = imgQueen; }
                    
                    if(suit === 'CLUBS') { card.row = 0; card.col = 2; }
                    else if(suit === 'HEARTS') { card.row = 1; card.col = 1; }
                    else if(suit === 'DIAMONDS') { card.row = 1; card.col = 0; }
                    else if(suit === 'SPADES') { card.row = 1; card.col = 2; }
                    deck.push(card);
                }
            });
            return shuffle(deck);
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) * (UI_RES.w / rect.width), y: (e.clientY - rect.top) * (UI_RES.h / rect.height) };
        }

        function resize() {
            let scale = Math.min(window.innerWidth / UI_RES.w, window.innerHeight / UI_RES.h);
            canvas.width = UI_RES.w; canvas.height = UI_RES.h;
            canvas.style.width = (UI_RES.w * scale) + 'px'; canvas.style.height = (UI_RES.h * scale) + 'px';
        }

        function init() {
            checkDevMode();
            loadProgression();
            resize(); 
            const toLoad = [imgBg, imgCards, imgRunBtn, imgLvlScreen, imgPills, imgRat, imgAxe, imgArmoured, imgBlind, imgQueen, imgBackswing, imgVictory];
            toLoad.forEach(img => img.crossOrigin = "anonymous");
            
            imgBg.onload = checkLoaded; imgBg.src = ASSETS.bg;
            imgCards.onload = checkLoaded; imgCards.src = ASSETS.cards;
            imgRunBtn.onload = checkLoaded; imgRunBtn.src = ASSETS.runBtn;
            imgLvlScreen.onload = checkLoaded; imgLvlScreen.src = ASSETS.lvlScreen;
            imgPills.onload = checkLoaded; imgPills.src = ASSETS.pills;
            imgRat.onload = checkLoaded; imgRat.src = ASSETS.rat;
            imgAxe.onload = checkLoaded; imgAxe.src = ASSETS.axe;
            imgArmoured.onload = checkLoaded; imgArmoured.src = ASSETS.armoured;
            imgBlind.onload = checkLoaded; imgBlind.src = ASSETS.blind;
            imgQueen.onload = checkLoaded; imgQueen.src = ASSETS.queen;
            imgBackswing.onload = checkLoaded; imgBackswing.src = ASSETS.backswing;
            imgVictory.onload = checkLoaded; imgVictory.src = ASSETS.victory;

            for(let i=1; i<=7; i++) {
                const bImg = new Image(); bImg.crossOrigin = "anonymous";
                bImg.src = `https://christaylor-design.github.io/Dead_Reckoning/assets/Base-upgrades_00${i}.png`;
                baseImages.push(bImg);
            }
            window.addEventListener('resize', resize);
            canvas.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('touchstart', (e) => handleStart(e.touches[0]), {passive: false});
            window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e.touches[0]); }, {passive: false});
            window.addEventListener('touchend', (e) => handleEnd(e.changedTouches[0] || e.touches[0]));
        }

        function checkLoaded() { if (++loadedCount === 12) { state.imagesLoaded = true; requestAnimationFrame(gameLoop); } }

        function initGame() {
            state.currentView = 'game'; state.deck = createDeck();
            state.medsTarget = 18; state.materialsTarget = 28;
            if (!state.isEndless) {
                state.medsTarget = 12 + (state.baseLevel - 1);
                state.materialsTarget = 22 + (state.baseLevel - 1);
            }
            state.playerHP = 20; state.shelterHP = 20; state.medsQuota = 0; state.materialsQuota = 0;
            state.inventory = [null, null]; state.scavengeArea = [null, null, null, null];
            state.storage = null; state.pocket = null; state.runUsed = false; state.gameActive = true;
            state.pillsActive = false; state.radExposure = 3;
            uiOverlay.style.display = 'none'; drawHand();
            addLog(`Mission Start. ${state.isEndless ? 'Survival Day ' + (state.survivalStreak + 1) : 'Level ' + state.baseLevel}`);
        }

        function checkGameOver() {
            if (state.playerHP <= 0 || state.shelterHP <= 0) {
                state.gameActive = false;
                if (state.isEndless) state.survivalStreak = 0; 
                overlayTitle.innerText = "MISSION FAILED"; overlayTitle.style.color = "#f00";
                overlayMsg.innerText = "Dead. The wasteland claims all."; uiOverlay.style.display = 'flex'; return true;
            }
            if (state.deck.length === 0 && state.scavengeArea.every(c => c === null)) {
                state.gameActive = false;
                const winMeds = state.medsQuota >= state.medsTarget, winMats = state.materialsQuota >= state.materialsTarget;
                const success = winMeds && winMats;
                
                if (state.isEndless) {
                    if (success) {
                        state.survivalStreak++;
                        state.bestStreak = Math.max(state.bestStreak, state.survivalStreak);
                    } else {
                        state.survivalStreak = 0;
                    }
                } else {
                    let pieces = success ? 5 : (winMeds || winMats) ? 3 : 1;
                    state.upgradePieces += pieces;
                    if (state.upgradePieces >= 10) { 
                        if (state.baseLevel < 7) {
                            state.upgradePieces -= 10; 
                            state.baseLevel++;
                            state.pendingUnlock = state.baseLevel; 
                        } else {
                            state.upgradePieces = 10;
                            state.showVictoryScreen = true;
                        }
                    }
                }
                saveProgression();
                overlayTitle.innerText = success ? "MISSION SUCCESS" : "MISSION PARTIAL";
                overlayTitle.style.color = success ? "#0f0" : "#ff0";
                overlayMsg.innerText = success ? "Returned safely." : "Incomplete delivery. Perimeter weakened."; uiOverlay.style.display = 'flex'; return true;
            }
            return false;
        }

        function drawHand() {
            state.avoidsUsedThisHand = 0;
            for (let i = 0; i < 4; i++) { if (state.scavengeArea[i] === null && state.deck.length > 0) state.scavengeArea[i] = state.deck.shift(); }
            checkGameOver();
        }

        function checkTurnState() { if (state.scavengeArea.filter(c => c !== null).length <= 1) endHand(); }

        function endHand() {
            let blindOnePresent = state.scavengeArea.some(c => c && c.specialName === 'The Blind One');
            if (state.storage) {
                if (state.storage.suit === 'HEARTS') state.medsQuota += state.storage.power;
                if (state.storage.suit === 'DIAMONDS') state.materialsQuota += state.storage.power;
                state.storage = null;
            }
            if (state.deck.length > 0) {
                let exposure = state.radExposure;
                if (blindOnePresent) { exposure *= 2; addLog("THE BLIND ONE CATALYSES THE RADIATION!", true); }
                state.playerHP -= exposure;
                addLog(`Radiation spike: -${exposure} HP.`);
            }
            if (!checkGameOver()) drawHand();
        }

        function drawCard(card, x, y, w, h, isDragging = false) {
            if (!card) return;
            const sw = 384, sh = 512;
            ctx.save();
            if (card.isSpecial || card.hasBuff) {
                let glowColor = (card.suit === 'CLUBS' && card.isSpecial) ? "#f00" : "#0f0";
                ctx.shadowBlur = 25; ctx.shadowColor = glowColor; ctx.strokeStyle = glowColor; ctx.lineWidth = 4;
                ctx.strokeRect(x, y, w, h);
            }
            if (card.distracted) { ctx.shadowBlur = 30; ctx.shadowColor = "#ff0"; ctx.strokeStyle = "#ff0"; ctx.lineWidth = 6; ctx.strokeRect(x, y, w, h); }
            if (card.usesLeft > 1) {
                ctx.shadowBlur = 20; ctx.shadowColor = "#0af"; ctx.strokeStyle = "#0af"; ctx.lineWidth = 8;
                ctx.strokeRect(x, y, w, h);
            }
            if (isDragging) { ctx.shadowBlur = 40; ctx.globalAlpha = 0.9; }

            if (card.isSpecial && card.asset) { ctx.drawImage(card.asset, x, y, w, h); } 
            else { ctx.drawImage(imgCards, card.col * sw, card.row * sh, sw, sh, x, y, w, h); }

            const currentPower = getZombiePower(card);
            if (currentPower > 0) {
                const fontSize = Math.floor(h * 0.12);
                ctx.font = `bold ${fontSize}px Arial`; ctx.lineWidth = 6;

        function getIntelData(level, step) {

        function handleStart(e) {
            const m = getEventPos(e); state.mouse = m;
            if (state.currentView === 'base') {
                if (state.showVictoryScreen) {
                    const b = UI.base.victoryButtons;
                    if (m.x > b.newCompound.x && m.x < b.newCompound.x + b.newCompound.w && m.y > b.newCompound.y && m.y < b.newCompound.y + b.newCompound.h) {
                        state.baseLevel = 1; state.upgradePieces = 0; state.isEndless = false; state.showVictoryScreen = false; state.survivalStreak = 0; saveProgression(); return;
                    }
                    if (m.x > b.endless.x && m.x < b.endless.x + b.endless.w && m.y > b.endless.y && m.y < b.endless.y + b.endless.h) {
                        state.isEndless = true; state.showVictoryScreen = false; saveProgression(); return;
                    }
                    return;
                }
                if (state.showUnlockOverlay) { 
                    if (state.pendingUnlock === 4 && state.revealStep === 0) state.revealStep = 1; 
                    else { state.showUnlockOverlay = false; state.pendingUnlock = null; state.revealStep = 0; }
                    return; 
                }
                if (state.showDatabase) { state.showDatabase = false; return; }
                if (m.x > UI.base.startBtn.x && m.x < UI.base.startBtn.x + UI.base.startBtn.w && m.y > UI.base.startBtn.y && m.y < UI.base.startBtn.y + UI.base.startBtn.h) initGame();
                if (m.x > UI.base.databaseBtn.x && m.x < UI.base.databaseBtn.x + UI.base.databaseBtn.w && m.y > UI.base.databaseBtn.y && m.y < UI.base.databaseBtn.y + UI.base.databaseBtn.h) state.showDatabase = true;
                return;
            }
            if (!state.gameActive) return;
            if (m.x > UI.runBtn.x && m.x < UI.runBtn.x + UI.runBtn.w && m.y > UI.runBtn.y && m.y < UI.runBtn.y + UI.runBtn.h && !state.runUsed) {
                if (isQueenPresent()) { addLog("THE ALPHA QUEEN SUPPRESSES ALL RETREAT. FIGHT OR DIE.", true); } else { triggerRun(); }
                return; 
            }
            [...UI.scavengeSlots.map((s,i)=>({s,i,o:'scavenge'})), ...UI.inventorySlots.map((s,i)=>({s,i,o:'inventory'})), {s:UI.storageSlot,o:'storage'}, {s:UI.pocketSlot,o:'pocket'}].forEach(item => {
                const {s, i, o} = item;
                const card = o==='scavenge'?state.scavengeArea[i]:o==='inventory'?state.inventory[i]:o==='storage'?state.storage:state.pocket;
                if (card && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    state.draggingCard = { card, origin: o, idx: i };
                    state.dragOffset = { x: m.x - s.x, y: m.y - s.y };
                    if(o==='scavenge')state.scavengeArea[i]=null; else if(o==='inventory')state.inventory[i]=null; else if(o==='storage')state.storage=null; else state.pocket=null;

        function handleMove(e) { state.mouse = getEventPos(e); }

        function handleEnd(e) {
            if (!state.draggingCard) return;
            const m = state.mouse, card = state.draggingCard.card, origin = state.draggingCard.origin;
            let placed = false;

            if (card.isSpecial) {
                state.scavengeArea.forEach((target, i) => {
                    const s = UI.scavengeSlots[i];
                    if (target && (target.suit === 'CLUBS' || target.isSpecial) && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                        if (origin === 'scavenge') { addLog("Secure the asset in your inventory or pocket first!", true); }
                        else {
                            if (card.specialName === 'The Axe') {
                                target.power = Math.max(0, target.power - 12);
                                if (target.power <= 0) { state.scavengeArea[i] = null; addLog("Axe hit! Threat neutralised."); }
                                else addLog("Axe hit! Threat weakened.");
                                if (card.usesLeft > 1) { card.usesLeft--; addLog(`Axe remains sharp. ${card.usesLeft} use remaining.`); placed = false; } else { placed = true; }
                            } else if (card.specialName === 'Wind-up Rat') {
                                target.distracted = true; addLog("Wind-up rat deployed."); placed = true;
                            }
                        }
                    }
                });
                if (!placed && card.specialName === 'Anti-rad Pills') {
                    const s = UI.actionSlots[0];
                    if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                        if (origin === 'scavenge') { addLog("Secure the pills in your inventory or pocket first!", true); }
                        else { state.pillsActive = true; state.radExposure = 2; addLog("Resistance increased."); placed = true; }
                    }
                }
                if (!placed && card.specialName === 'Back Swing') {
                    if (origin === 'scavenge') { addLog("Secure the utility card first!", true); }
                    else {
                        UI.inventorySlots.forEach((s, i) => {
                            if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h && state.inventory[i] && (state.inventory[i].suit === 'SPADES' || state.inventory[i].specialName === 'The Axe')) {
                                state.inventory[i].usesLeft = 2; addLog("Asset optimised for dual use."); placed = true;
                            }
                        });
                        if (!placed && m.x > UI.storageSlot.x && m.x < UI.storageSlot.x + UI.storageSlot.w && m.y > UI.storageSlot.y && m.y < UI.storageSlot.y + UI.storageSlot.h && state.storage && state.storage.suit === 'SPADES') {
                            state.storage.usesLeft = 2; addLog("Stored weapon optimised."); placed = true;
                        }
                        if (!placed && m.x > UI.pocketSlot.x && m.x < UI.pocketSlot.x + UI.pocketSlot.w && m.y > UI.pocketSlot.y && m.y < UI.pocketSlot.y + UI.pocketSlot.h && state.pocket && state.pocket.specialName === 'The Axe') {
                            state.pocket.usesLeft = 2; addLog("The Axe optimised while in pocket."); placed = true;
                        }
                    }
                }
            }
            if (!placed) state.scavengeArea.forEach((target, i) => {
                const s = UI.scavengeSlots[i];
                if (target && (target.suit === 'CLUBS' || target.isSpecial) && card.suit === 'SPADES' && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    if (origin !== 'scavenge') {
                        const targetPower = getZombiePower(target);
                        if (card.power >= targetPower) { 
                            addLog("Threat neutralised!"); state.scavengeArea[i] = null; 
                            if (card.usesLeft > 1) { card.usesLeft--; placed = false; return; }
                            placed = true;
                        } else { 
                            target.power -= card.power; addLog("Threat weakened.");
                            if (card.usesLeft > 1) { card.usesLeft--; placed = false; return; }
                            placed = true; 
                        }
                    } else addLog("Pick up weapon first!", true);
                }
            });
            if (!placed && m.x > UI.discardSlot.x - 20 && m.x < UI.discardSlot.x + UI.discardSlot.w + 20 && m.y > UI.discardSlot.y - 20 && m.y < UI.discardSlot.y + UI.discardSlot.h + 20) {
                if (card.suit === 'CLUBS' || (card.isSpecial && card.suit === 'CLUBS')) addLog("Can't scrap a threat!", true);
                else if (origin !== 'scavenge') { addLog("Scrapped."); placed = true; }
                else addLog("Pick up item first!", true);
            }
            if (!placed) UI.actionSlots.forEach(s => {
                if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    if (card.suit === 'DIAMONDS') addLog("Belongs at Shelter station!", true);
                    else if (card.suit === 'SPADES') addLog("Use directly on threats!", true);
                    else if (s.type === 'scavenger' && card.suit === 'HEARTS' && origin !== 'scavenge') { state.playerHP = Math.min(20, state.playerHP + card.power); placed = true; }
                    else if (card.suit === 'CLUBS' || card.isSpecial) {
                        if (s.type === 'avoid' && card.specialName === 'The Blind One' && !card.distracted) { addLog("THE BLIND ONE HEARS YOU! You cannot avoid them without a distraction.", true); return; }
                        const targetPower = getZombiePower(card);
                        if (s.type === 'scavenger') { state.playerHP -= targetPower; placed = true; }
                        else if (s.type === 'avoid' && state.avoidsUsedThisHand < 1) { 
                            if (!card.distracted) {
                                const dmg = (card.specialName === 'The Alpha Queen') ? 15 : (card.specialName === 'Armoured Zombie') ? 10 : 5;
                                state.shelterHP -= dmg;
                                if (dmg === 15) addLog("THE ALPHA QUEEN CRUSHES THE SHELTER GATES! -15 HP.", true);
                                else if (dmg === 10) addLog("ARMOURED ZOMBIE BREACHED THE PERIMETER! -10 HP.", true);
                                else addLog("Zombie avoided at cost of shelter integrity.");
                            } else { addLog("Zombie distracted! Shelter secured."); }
                            state.avoidsUsedThisHand++; placed = true; 
                        }
                    }
                }
            });
            if (!placed && m.x > UI.fixShelterSlot.x && m.x < UI.fixShelterSlot.x + UI.fixShelterSlot.w && m.y > UI.fixShelterSlot.y && m.y < UI.fixShelterSlot.y + UI.fixShelterSlot.h) {
                if (origin !== 'scavenge' && card.suit === 'DIAMONDS') { state.shelterHP = Math.min(20, state.shelterHP + card.power); placed = true; }
                else addLog("Only materials fit here!", true);
            }
            if (!placed && m.x > UI.pocketSlot.x && m.x < UI.pocketSlot.x + UI.pocketSlot.w && m.y > UI.pocketSlot.y && m.y < UI.pocketSlot.y + UI.pocketSlot.h && !state.pocket) {
                if (card.isSpecial) { state.pocket = card; placed = true; }
                else addLog("Only unique items fit here!", true);
            }
            if (!placed) {
                UI.inventorySlots.forEach((s, i) => {
                    if (!placed && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                        if (card.suit === 'CLUBS' || (card.isSpecial && card.suit === 'CLUBS')) addLog("Zombie held hands!", true);
                        else if (!state.inventory[i]) { state.inventory[i] = card; placed = true; }
                    }
                });
                if (!placed && m.x > UI.storageSlot.x && m.x < UI.storageSlot.x + UI.storageSlot.w && m.y > UI.storageSlot.y && m.y < UI.storageSlot.y + UI.storageSlot.h) {
                    if (card.suit === 'CLUBS' || (card.isSpecial && card.suit === 'CLUBS')) addLog("Zombie in pack!", true);
                    else if (card.suit === 'SPADES') addLog("No room for weapons.", true);
                    else if (!state.storage) { state.storage = card; placed = true; }
                }
            }
            if (!placed && card.suit === 'HEARTS' && m.x > UI.bars.player.x && m.x < UI.bars.player.x + UI.bars.player.w && m.y > UI.bars.player.y && m.y < UI.bars.player.y + UI.bars.player.h && origin !== 'scavenge') { state.playerHP = Math.min(20, state.playerHP + card.power); placed = true; }
            if (!placed) {
                if (origin === 'scavenge') state.scavengeArea[state.draggingCard.idx] = card;
                else if (origin === 'inventory') state.inventory[state.draggingCard.idx] = card;
                else if (origin === 'storage') state.storage = card;
                else if (origin === 'pocket') state.pocket = card;
            } else if (!checkGameOver()) checkTurnState();
            state.draggingCard = null;
        }

        function triggerRun() {
            const current = state.scavengeArea.filter(c => c !== null);
            if (current.length === 0 && state.deck.length === 0) return;
            state.deck.push(...current); shuffle(state.deck); state.scavengeArea = [null,null,null,null]; state.runUsed = true; 
            addLog("Retreat successful."); drawHand();
        }

        function gameLoop() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, UI_RES.w, UI_RES.h); drawUI(); requestAnimationFrame(gameLoop); }
        window.onload = init;
    </script>
</body>
</html>
