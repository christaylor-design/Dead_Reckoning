<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dead Reckoning: Zombie Survival</title>
    
    <!-- PWA / Mobile App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dead Reckoning">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Link to your GitHub manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body {
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }

        /* Tray Icons Style */
        .tray-icon {
            position: absolute;
            bottom: 20px;
            width: 42px; 
            height: 42px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 21px;
            z-index: 20;
            transition: background 0.2s, transform 0.1s;
        }
        .tray-icon:hover { background: rgba(255,255,255,0.25); }
        .tray-icon:active { transform: scale(0.9); }

        #help-icon { left: 20px; }
        #settings-icon { left: 75px; }

        #ui-overlay, #instructions-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        #overlay-title {
            color: #f00;
            margin: 0;
            font-size: clamp(40px, 8vw, 120px); 
            line-height: 1.1;
        }

        #overlay-msg {
            color: #ccc;
            font-size: clamp(18px, 2.5vw, 32px);
            max-width: 90%;
            line-height: 1.4;
            margin: 20px 0;
        }

        #instructions-overlay {
            z-index: 150;
            background: rgba(0,0,0,0.95);
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #instruction-img {
            max-width: 85%;
            max-height: 65%;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            border: 2px solid #444;
            cursor: pointer;
        }

        .zombie-font { font-family: 'Creepster', cursive; }
        
        .btn {
            padding: clamp(10px, 2vh, 20px) clamp(20px, 4vw, 50px);
            background: #900;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: clamp(16px, 2vw, 24px);
            transition: background 0.2s;
            margin: 10px;
        }

        .btn:hover { background: #b00; }

        .close-help { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            font-size: 50px; 
            color: #fff; 
            padding: 10px;
            z-index: 160;
            cursor: pointer;
        }

        #dev-tools {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2000;
            display: none; 
            flex-direction: column;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
        }
        .dev-btn {
            background: #444;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            text-transform: uppercase;
        }
        .dev-btn:hover { background: #030; }
    </style>
</head>
<body>

    <div id="dev-tools">
        <button class="dev-btn" onclick="devWin()">DEV: Win Mission</button>
        <button class="dev-btn" onclick="devAddScrap()">DEV: +5 Scrap</button>
        <button class="dev-btn" onclick="devResetSave()">DEV: Reset Save</button>
    </div>

    <div id="rotate-overlay">
        <div class="zombie-font" style="font-size: 60px; color: #f00; margin-bottom: 20px;">INCOMING THREAT</div>
        <p style="font-size: 24px;">Please rotate your device to <strong>LANDSCAPE</strong>.</p>
        <div style="font-size: 80px; margin-top: 20px;">📱🔄</div>
    </div>

    <div id="game-container">
        <!-- System Tray -->
        <div id="help-icon" class="tray-icon" onclick="toggleInstructions(true)">?</div>
        
        <div id="settings-icon" class="tray-icon" onclick="toggleSettings(true)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V11a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Overlays -->
        <div id="ui-overlay">
            <h1 id="overlay-title" class="zombie-font">MISSION FAILED</h1>
            <p id="overlay-msg">The colony has fallen.</p>
            <div id="overlay-actions">
                <button class="btn" onclick="initGame()">Try Again</button>
                <button id="btn-return-base" class="btn" style="background:#444;" onclick="returnToBase()">Return to Base</button>
            </div>
        </div>

        <div id="instructions-overlay">
            <span class="close-help" onclick="toggleInstructions(false)">×</span>
            <img id="instruction-img" src="https://christaylor-design.github.io/Dead_Reckoning/assets/Instruction%20board.png" alt="Survival Guide" onclick="toggleInstructions(false)">
            <div style="margin-top: 30px; display: flex; gap: 20px;">
                <button class="btn" style="background: #444;" onclick="returnToBaseFromHelp()">Back to Base</button>
                <button class="btn" onclick="toggleInstructions(false)">Resume Game</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('ui-overlay');
        const instructionsOverlay = document.getElementById('instructions-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        const UI_RES = { w: 2752, h: 1536 };

        // 1. ASSET DEFINITIONS
        const imgBg = new Image();
        const imgCards = new Image();
        const imgRunBtn = new Image();
        const imgLvlScreen = new Image();
        const imgPills = new Image();
        const imgRat = new Image();
        const imgAxe = new Image();
        const imgArmoured = new Image();
        const imgBlind = new Image();
        const imgQueen = new Image();
        const imgBackswing = new Image();
        const imgVictory = new Image();

        const baseImages = []; 
        let loadedCount = 0;

        const bgMusic = new Audio('https://christaylor-design.github.io/Dead_Reckoning/assets/The_Inkwell_Grin.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.6;
        let musicInitialised = false;

        const assetMap = {
            pills: imgPills, rat: imgRat, axe: imgAxe, armoured: imgArmoured, 
            backswing: imgBackswing, blind: imgBlind, queen: imgQueen
        };

        const ASSETS = {
            bg: 'https://christaylor-design.github.io/Dead_Reckoning/assets/New%20background.png',
            cards: 'https://christaylor-design.github.io/Dead_Reckoning/Card%20board.png',
            runBtn: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Run%20Button.png',
            lvlScreen: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Compound%20Level%20Screen.png',
            pills: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Anti-Rad%20Pills.png',
            rat: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Wind-up%20Rat.png',
            axe: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Axe.png',
            armoured: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Armoured%20Zombie.png',
            blind: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Blind%20One.png',
            queen: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Queen%20Zombie.png',
            backswing: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Backswing.png',
            victory: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Victory%20Screen.png'
        };

        const SPECIAL_INTEL = [
            { level: 2, step: 0, title: "Anti-rad Pills", suit: 'HEARTS', val: 1, pwr: 0, assetKey: 'pills', desc: "REDUCES RADIATION SPIKE FROM -3 TO -2 HP. [ACTION: DROP ON SCAVENGER SLOT]" },
            { level: 3, step: 0, title: "Wind-up Rat", suit: 'DIAMONDS', val: 1, pwr: 0, assetKey: 'rat', desc: "SOUND DISTRACTION. DEALS 0 SHELTER DAMAGE IF AVOIDED. BYPASSES 'THE BLIND ONE'." },
            { level: 4, step: 0, title: "The Axe", suit: 'SPADES', val: 1, pwr: 12, assetKey: 'axe', desc: "HEAVY COMBAT ASSET. DEALS 12 DAMAGE INSTANTLY. VITAL FOR HIGH-HP TARGETS." },
            { level: 4, step: 1, title: "Armoured Zombie", suit: 'CLUBS', val: 1, pwr: 15, assetKey: 'armoured', desc: "HIGH-RESISTANCE THREAT. HP: 15. DEALS 10 HP DAMAGE IF AVOIDED. USE AXE TO NEUTRALISE." },
            { level: 5, step: 0, title: "Back Swing", suit: 'SPADES', val: 2, pwr: 0, assetKey: 'backswing', desc: "OPTIMISATION. ALLOWS ANY WEAPON TO BE USED TWICE BEFORE DISCARDING. [ACTION: DROP ON WEAPON]" },
            { level: 6, step: 0, title: "The Blind One", suit: 'CLUBS', val: 2, pwr: 8, assetKey: 'blind', desc: "CANNOT BE AVOIDED WITHOUT RAT. IF LEFT ALIVE, RADIOLOGICAL DAMAGE IS DOUBLED." },
            { level: 7, step: 0, title: "The Alpha Queen", suit: 'CLUBS', val: 3, pwr: 10, assetKey: 'queen', desc: "OMEGA THREAT. SUPPRESSES RETREAT. BUFFS ZOMBIES (+3). BREACHES GATES IF AVOIDED (-15 HP)." }
        ];

        // 2. STATE MANAGEMENT
        const state = {
            currentView: 'base', 
            baseLevel: 1,
            upgradePieces: 0,
            showUnlockOverlay: false,
            showDatabase: false,
            showSettings: false,
            confirmRestart: false,
            musicEnabled: true,
            showVictoryScreen: false,
            pendingUnlock: null,
            revealStep: 0, 
            survivalStreak: 0,
            bestStreak: 0,
            isEndless: false,
            deck: [],
            scavengeArea: [null, null, null, null],
            inventory: [null, null],
            storage: null,
            pocket: null,
            playerHP: 20,
            shelterHP: 20,
            medsQuota: 0,
            medsTarget: 12,
            materialsQuota: 0,
            materialsTarget: 22,
            avoidsUsedThisHand: 0,
            runUsed: false,
            gameActive: false,
            draggingCard: null,
            dragOffset: { x: 0, y: 0 },
            mouse: { x: 0, y: 0 },
            imagesLoaded: false,
            logText: "Initialising compound systems...",
            logColor: "#0f0",
            radExposure: 3,
            pillsActive: false,
            isDevMode: false // Default to false
        };

        const UI_COORDS = {
            scavengeSlots: [
                { x: 903, y: 519, w: 216, h: 293 },
                { x: 1202, y: 519, w: 216, h: 293 },
                { x: 1501, y: 519, w: 216, h: 293 },
                { x: 1803, y: 519, w: 216, h: 293 }
            ],
            inventorySlots: [
                { x: 343, y: 949, w: 211, h: 287 },
                { x: 646, y: 949, w: 211, h: 287 }
            ],
            actionSlots: [
                { x: 1151, y: 983, w: 267, h: 363, type: 'scavenger' }, 
                { x: 1547, y: 983, w: 267, h: 363, type: 'avoid' }
            ],
            storageSlot: { x: 2197, y: 949, w: 211, h: 287 },
            fixShelterSlot: { x: 2327, y: 519, w: 211, h: 287 },
            pocketSlot: { x: 186, y: 519, w: 192, h: 261 },
            discardSlot: { x: 83, y: 80, w: 211, h: 287 }, 
            helpScreen: { x: 482, y: 510, w: 327, h: 331 },
            runBtn: { x: 2471, y: 73, w: 194, h: 96 },
            bars: {
                player: { x: 529, y: 243, w: 950, h: 141, color: '#4a1', val: 'playerHP', max: 20, label: 'HEALTH' },
                shelter: { x: 1608, y: 243, w: 950, h: 141, color: '#26a', val: 'shelterHP', max: 20, label: 'SHELTER' }
            },
            text: {
                deck: { x: 1662, y: 113, w: 121, h: 56 },
                meds: { x: 1976, y: 86, w: 113, h: 64 },
                materials: { x: 2255, y: 86, w: 113, h: 64 }
            },
            base: {
                startBtn: { x: 1100, y: 1300, w: 550, h: 150 },
                screen: { x: 2291, y: 988, w: 423, h: 485 },
                lvlNum: { x: 2500, y: 1148, w: 145, h: 72 },
                upgradeTxt: { x: 2500, y: 1242, w: 145, h: 72 },
                progressBar: { x: 2345, y: 1310, w: 310, h: 70 },
                unlockModal: { x: 476, y: 218, w: 1800, h: 1100 },
                databaseBtn: { x: 2291, y: 830, w: 423, h: 140 },
                victoryButtons: {
                    newCompound: { x: 476, y: 1250, w: 850, h: 180 },
                    endless: { x: 1426, y: 1250, w: 850, h: 180 }
                }
            }
        };

        // --- CORE UTILITY FUNCTIONS ---
        function addLog(msg, isError = false) { 
            state.logText = msg; 
            state.logColor = isError ? '#f33' : '#0f0'; 
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { 
                x: (e.clientX - rect.left) * (UI_RES.w / rect.width), 
                y: (e.clientY - rect.top) * (UI_RES.h / rect.height) 
            };
        }

        function resize() {
            let scale = Math.min(window.innerWidth / UI_RES.w, window.innerHeight / UI_RES.h);
            canvas.width = UI_RES.w; canvas.height = UI_RES.h;
            canvas.style.width = (UI_RES.w * scale) + 'px'; canvas.style.height = (UI_RES.h * scale) + 'px';
        }

        function checkDevMode() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('dev')) state.isDevMode = true;
            const dt = document.getElementById('dev-tools');
            if (dt) dt.style.display = state.isDevMode ? 'flex' : 'none';
        }

        function applyMusicState() {
            if (state.musicEnabled) bgMusic.play().catch(e => console.log("Audio waiting for interaction..."));
            else bgMusic.pause();
        }

        function saveProgression() {
            localStorage.setItem('dr_save_v1', JSON.stringify({ 
                level: state.baseLevel, pieces: state.upgradePieces, best: state.bestStreak, endless: state.isEndless, music: state.musicEnabled
            }));
        }

        function loadProgression() {
            const saved = localStorage.getItem('dr_save_v1');
            if (saved) {
                const data = JSON.parse(saved);
                state.baseLevel = data.level || 1;
                state.upgradePieces = data.pieces || 0;
                state.bestStreak = data.best || 0;
                state.isEndless = data.endless || false;
                state.musicEnabled = data.music !== undefined ? data.music : true;
            }
        }

        function restartCompound() { localStorage.removeItem('dr_save_v1'); location.reload(); }

        // --- DEV TOOLS ---
        window.devWin = function() {
            if (!state.isDevMode || state.currentView !== 'game') return;
            state.medsQuota = state.medsTarget; state.materialsQuota = state.materialsTarget;
            state.deck = []; state.scavengeArea = [null, null, null, null];
            checkGameOver();
        };

        window.devAddScrap = function() {
            if (!state.isDevMode) return;
            state.upgradePieces += 5;
            if (state.upgradePieces >= 10 && state.baseLevel < 7) { 
                state.upgradePieces -= 10; state.baseLevel++;
                state.pendingUnlock = state.baseLevel; state.revealStep = 0;
            } else if (state.baseLevel === 7 && state.upgradePieces >= 10) {
                state.upgradePieces = 10;
                state.showVictoryScreen = true;
            }
            saveProgression();
        };

        window.devResetSave = function() {
            if (!state.isDevMode) return;
            restartCompound();
        };

        // --- GAMEPLAY LOGIC ---
        function isQueenPresent() { return state.scavengeArea.some(c => c && c.specialName === 'The Alpha Queen'); }

        function getZombiePower(card) {
            if (!card || (card.suit !== 'CLUBS' && !card.isSpecial)) return card?.power || 0;
            let p = card.power;
            if (isQueenPresent() && card.specialName !== 'The Alpha Queen') p += 3;
            return p;
        }

        function drawHand() {
            state.avoidsUsedThisHand = 0;
            for (let i = 0; i < 4; i++) {
                if (state.scavengeArea[i] === null && state.deck.length > 0) state.scavengeArea[i] = state.deck.shift();
            }
            checkGameOver();
        }

        function checkTurnState() { if (state.scavengeArea.filter(c => c !== null).length <= 1) endHand(); }

        function endHand() {
            let blindOnePresent = state.scavengeArea.some(c => c && c.specialName === 'The Blind One');
            if (state.storage) {
                if (state.storage.suit === 'HEARTS') state.medsQuota += state.storage.power;
                if (state.storage.suit === 'DIAMONDS') state.materialsQuota += state.storage.power;
                state.storage = null;
            }
            if (state.deck.length > 0) {
                let exposure = state.radExposure;
                if (blindOnePresent) { exposure *= 2; addLog("THE BLIND ONE CATALYSES THE RADIATION!", true); }
                state.playerHP -= exposure;
                addLog(`Radiation spike: -${exposure} HP.`);
            }
            if (!checkGameOver()) drawHand();
        }

        function checkGameOver() {
            if (state.playerHP <= 0 || state.shelterHP <= 0) {
                state.gameActive = false; if (state.isEndless) state.survivalStreak = 0; 
                overlayTitle.innerText = "MISSION FAILED"; overlayTitle.style.color = "#f00";
                overlayMsg.innerText = "The wasteland claims all."; uiOverlay.style.display = 'flex'; return true;
            }
            if (state.deck.length === 0 && state.scavengeArea.every(c => c === null)) {
                state.gameActive = false;
                const winMeds = state.medsQuota >= state.medsTarget, winMats = state.materialsQuota >= state.materialsTarget;
                const success = winMeds && winMats;
                if (state.isEndless) {
                    if (success) { state.survivalStreak++; state.bestStreak = Math.max(state.bestStreak, state.survivalStreak); }
                    else state.survivalStreak = 0;
                } else {
                    let pieces = success ? 5 : (winMeds || winMats) ? 3 : 1;
                    state.upgradePieces += pieces;
                    if (state.upgradePieces >= 10) { 
                        if (state.baseLevel < 7) { state.upgradePieces -= 10; state.baseLevel++; state.pendingUnlock = state.baseLevel; }
                        else { state.upgradePieces = 10; state.showVictoryScreen = true; }
                    }
                }
                saveProgression();
                overlayTitle.innerText = success ? "MISSION SUCCESS" : "MISSION PARTIAL"; overlayTitle.style.color = success ? "#0f0" : "#ff0";
                overlayMsg.innerText = success ? "Returned safely." : "Incomplete delivery."; uiOverlay.style.display = 'flex'; return true;
            }
            return false;
        }

        function createDeck() {
            const deck = [];
            const suits = ['HEARTS', 'CLUBS', 'SPADES', 'DIAMONDS'];
            suits.forEach(suit => {
                const maxRank = (suit === 'CLUBS') ? 13 : 9;
                for (let i = 1; i <= maxRank; i++) {
                    let card = { suit, value: i, power: i, isSpecial: false, specialName: '', id: 'c-' + Math.random(), distracted: false, usesLeft: 1 };
                    const special = SPECIAL_INTEL.find(s => s.suit === suit && s.val === i && state.baseLevel >= s.level);
                    if (special) {
                        card.isSpecial = true; card.specialName = special.title;
                        card.power = special.pwr; card.asset = assetMap[special.assetKey];
                    }
                    if(suit === 'CLUBS') { card.row = 0; card.col = 2; }
                    else if(suit === 'HEARTS') { card.row = 1; card.col = 1; }
                    else if(suit === 'DIAMONDS') { card.row = 1; card.col = 0; }
                    else if(suit === 'SPADES') { card.row = 1; card.col = 2; }
                    deck.push(card);
                }
            });
            return shuffle(deck);
        }

        function initGame() {
            if (!musicInitialised) { musicInitialised = true; applyMusicState(); }
            state.currentView = 'game'; state.deck = createDeck();
            state.medsTarget = 18; state.materialsTarget = 28;
            if (!state.isEndless) { state.medsTarget = 12 + (state.baseLevel - 1); state.materialsTarget = 22 + (state.baseLevel - 1); }
            state.playerHP = 20; state.shelterHP = 20; state.medsQuota = 0; state.materialsQuota = 0;
            state.inventory = [null, null]; state.scavengeArea = [null, null, null, null];

                state.showSettings = false; state.confirmRestart = false; return;

                    const b = UI_COORDS.base.victoryButtons;

                    return;

                    if (state.pendingUnlock === 4 && state.revealStep === 0) state.revealStep = 1; 
                    else { state.showUnlockOverlay = false; state.pendingUnlock = null; state.revealStep = 0; }
                    return; 
                }
                if (state.showDatabase) { state.showDatabase = false; return; }
                if (m.x > UI_COORDS.base.startBtn.x && m.x < UI_COORDS.base.startBtn.x + UI_COORDS.base.startBtn.w && m.y > UI_COORDS.base.startBtn.y && m.y < UI_COORDS.base.startBtn.y + UI_COORDS.base.startBtn.h) initGame();

                state.scavengeArea.forEach((target, i) => {
                    const s = UI_COORDS.scavengeSlots[i];
                    if (target && (target.suit === 'CLUBS' || target.isSpecial) && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                        if (origin === 'scavenge') { addLog("Secure asset first!", true); }
                        else {
                            if (card.specialName === 'The Axe') {
                                target.power = Math.max(0, target.power - 12);
                                if (target.power <= 0) { state.scavengeArea[i] = null; addLog("Axe hit! Neutralised."); } else addLog("Axe hit! Weakened.");
                                if (card.usesLeft > 1) { card.usesLeft--; placed = false; } else { placed = true; } combatTriggered = true;
                            } else if (card.specialName === 'Wind-up Rat') { target.distracted = true; addLog("Rat deployed."); placed = true; combatTriggered = true; }
                        }
                    }
                });
                if (!placed && !combatTriggered && card.specialName === 'Anti-rad Pills') {
                    const s = UI_COORDS.actionSlots[0];
                    if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) { if (origin === 'scavenge') addLog("Secure pills first!", true); else { state.pillsActive = true; state.radExposure = 2; addLog("Resistant."); placed = true; } }
                }
                if (!placed && !combatTriggered && card.specialName === 'Back Swing') {
                    if (origin === 'scavenge') addLog("Secure card first!", true);
                    else {
                        UI_COORDS.inventorySlots.forEach((s, i) => { if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h && state.inventory[i] && (state.inventory[i].suit === 'SPADES' || state.inventory[i].specialName === 'The Axe')) { state.inventory[i].usesLeft = 2; addLog("Optimised."); placed = true; } });
                        if (!placed && m.x > UI_COORDS.storageSlot.x && m.x < UI_COORDS.storageSlot.x + UI_COORDS.storageSlot.w && m.y > UI_COORDS.storageSlot.y && m.y < UI_COORDS.storageSlot.y + UI_COORDS.storageSlot.h && state.storage && (state.storage.suit === 'SPADES' || state.storage.specialName === 'The Axe')) { state.storage.usesLeft = 2; addLog("Stored weapon optimised."); placed = true; }
                        if (!placed && m.x > UI_COORDS.pocketSlot.x && m.x < UI_COORDS.pocketSlot.x + UI_COORDS.pocketSlot.w && m.y > UI_COORDS.pocketSlot.y && m.y < UI_COORDS.pocketSlot.y + UI_COORDS.pocketSlot.h && state.pocket && state.pocket.specialName === 'The Axe') { state.pocket.usesLeft = 2; addLog("Pocket axe optimised."); placed = true; }
                    }
                }
            }
            if (!placed && !combatTriggered) state.scavengeArea.forEach((target, i) => {
                const s = UI_COORDS.scavengeSlots[i];
                if (target && (target.suit === 'CLUBS' || target.isSpecial) && card.suit === 'SPADES' && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    if (origin !== 'scavenge') {
                        const targetPower = getZombiePower(target);
                        if (card.power >= targetPower) { addLog("Neutralised!"); state.scavengeArea[i] = null; if (card.usesLeft > 1) { card.usesLeft--; placed = false; } else { placed = true; } combatTriggered = true; } 
                        else { target.power -= card.power; addLog("Weakened."); if (card.usesLeft > 1) { card.usesLeft--; placed = false; } else { placed = true; } combatTriggered = true; }
                    } else addLog("Pick up weapon first!", true);
                }
            });
            if (!placed && !combatTriggered && m.x > UI_COORDS.discardSlot.x - 20 && m.x < UI_COORDS.discardSlot.x + UI_COORDS.discardSlot.w + 20 && m.y > UI_COORDS.discardSlot.y - 20 && m.y < UI_COORDS.discardSlot.y + UI_COORDS.discardSlot.h + 20) { if (card.suit === 'CLUBS' || (card.isSpecial && card.suit === 'CLUBS')) addLog("Threat hazard!", true); else if (origin !== 'scavenge') { addLog("Scrapped."); placed = true; } else addLog("Pick up item first!", true); }
            if (!placed && !combatTriggered) UI_COORDS.actionSlots.forEach(s => {
                if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    if (card.suit === 'DIAMONDS') addLog("Station required!", true);
                    else if (card.suit === 'SPADES') addLog("Use on threats!", true);
                    else if (s.type === 'scavenger' && card.suit === 'HEARTS' && origin !== 'scavenge') { state.playerHP = Math.min(20, state.playerHP + card.power); placed = true; }
                    else if (card.suit === 'CLUBS' || card.isSpecial) {
                        if (s.type === 'avoid' && card.specialName === 'The Blind One' && !card.distracted) { addLog("THE BLIND ONE HEARS YOU!", true); return; }
                        const targetPower = getZombiePower(card); if (s.type === 'scavenger') { state.playerHP -= targetPower; placed = true; }
                        else if (s.type === 'avoid' && state.avoidsUsedThisHand < 1) { if (!card.distracted) { const dmg = (card.specialName === 'The Alpha Queen') ? 15 : (card.specialName === 'Armoured Zombie') ? 10 : 5; state.shelterHP -= dmg; } state.avoidsUsedThisHand++; placed = true; }
                    }
                }
            });
            if (!placed && !combatTriggered && m.x > UI_COORDS.fixShelterSlot.x && m.x < UI_COORDS.fixShelterSlot.x + UI_COORDS.fixShelterSlot.w && m.y > UI_COORDS.fixShelterSlot.y && m.y < UI_COORDS.fixShelterSlot.y + UI_COORDS.fixShelterSlot.h) { if (origin !== 'scavenge' && card.suit === 'DIAMONDS') { state.shelterHP = Math.min(20, state.shelterHP + card.power); placed = true; } }
            if (!placed && !combatTriggered && m.x > UI_COORDS.pocketSlot.x && m.x < UI_COORDS.pocketSlot.x + UI_COORDS.pocketSlot.w && m.y > UI_COORDS.pocketSlot.y && m.y < UI_COORDS.pocketSlot.y + UI_COORDS.pocketSlot.h && !state.pocket) { if (card.isSpecial) { state.pocket = card; placed = true; } }
            if (!placed && !combatTriggered) {
                UI_COORDS.inventorySlots.forEach((s, i) => { if (!placed && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) { if (card.suit === 'CLUBS' || (card.isSpecial && card.suit === 'CLUBS')) addLog("Threat hazard!", true); else if (!state.inventory[i]) { state.inventory[i] = card; placed = true; } } });
                if (!placed && m.x > UI_COORDS.storageSlot.x && m.x < UI_COORDS.storageSlot.x + UI_COORDS.storageSlot.w && m.y > UI_COORDS.storageSlot.y && m.y < UI_COORDS.storageSlot.y + UI_COORDS.storageSlot.h) { if (card.suit === 'CLUBS' || (card.isSpecial && card.suit === 'CLUBS')) addLog("Threat hazard!", true); else if (!state.storage) { state.storage = card; placed = true; } }
            }
            if (!placed && !combatTriggered && card.suit === 'HEARTS' && m.x > UI_COORDS.bars.player.x && m.x < UI_COORDS.bars.player.x + UI_COORDS.bars.player.w && m.y > UI_COORDS.bars.player.y && m.y < UI_COORDS.bars.player.y + UI_COORDS.bars.player.h && origin !== 'scavenge') { state.playerHP = Math.min(20, state.playerHP + card.power); placed = true; }
            if (!placed) { if (origin === 'scavenge') state.scavengeArea[state.draggingCard.idx] = card; else if (origin === 'inventory') state.inventory[state.draggingCard.idx] = card; else if (origin === 'storage') state.storage = card; else if (origin === 'pocket') state.pocket = card; } 
            else if (!checkGameOver()) checkTurnState();
            state.draggingCard = null;
        }

        function triggerRun() { const current = state.scavengeArea.filter(c => c !== null); if (current.length === 0 && state.deck.length === 0) return; state.deck.push(...current); shuffle(state.deck); state.scavengeArea = [null,null,null,null]; state.runUsed = true; addLog("Retreat successful."); drawHand(); }
        
        function gameLoop() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, UI_RES.w, UI_RES.h); drawUI(); requestAnimationFrame(gameLoop); }
        
        function init() {
            checkDevMode(); loadProgression(); resize(); 
            const toLoad = [imgBg, imgCards, imgRunBtn, imgLvlScreen, imgPills, imgRat, imgAxe, imgArmoured, imgBlind, imgQueen, imgBackswing, imgVictory];
            toLoad.forEach(img => { img.crossOrigin = "anonymous"; img.onload = checkLoaded; });
            imgBg.src = ASSETS.bg; imgCards.src = ASSETS.cards; imgRunBtn.src = ASSETS.runBtn;
            imgLvlScreen.src = ASSETS.lvlScreen; imgPills.src = ASSETS.pills; imgRat.src = ASSETS.rat;
            imgAxe.src = ASSETS.axe; imgArmoured.src = ASSETS.armoured; imgBlind.src = ASSETS.blind;
            imgQueen.src = ASSETS.queen; imgBackswing.src = ASSETS.backswing; imgVictory.src = ASSETS.victory;
            for(let i=1; i<=7; i++) {
                const bImg = new Image(); bImg.crossOrigin = "anonymous";
                bImg.src = `https://christaylor-design.github.io/Dead_Reckoning/assets/Base-upgrades_00${i}.png`;
                baseImages.push(bImg);
            }
            window.addEventListener('resize', resize);
            canvas.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('touchstart', (e) => handleStart(e.touches[0]), {passive: false});
            window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e.touches[0]); }, {passive: false});
            window.addEventListener('touchend', (e) => handleEnd(e.changedTouches[0] || e.touches[0]));
        }

        window.onload = init;
    </script>
</body>
</html>
