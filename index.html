<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dead Reckoning: Zombie Survival</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body {
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }

        #help-icon {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 42px; 
            height: 42px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 21px;
            z-index: 20;
        }

        #ui-overlay, #instructions-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
        }

        #instructions-overlay {
            cursor: pointer;
            z-index: 150;
        }

        #instruction-img {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            border: 2px solid #444;
        }

        .zombie-font { font-family: 'Creepster', cursive; }
        
        .btn {
            margin-top: 20px;
            padding: 20px 50px;
            background: #900;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 24px;
        }

        .close-help { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            font-size: 50px; 
            color: #fff; 
            padding: 10px;
            z-index: 160;
        }
    </style>
</head>
<body>

    <div id="rotate-overlay">
        <div class="zombie-font" style="font-size: 60px; color: #f00; margin-bottom: 20px;">INCOMING THREAT</div>
        <p style="font-size: 24px;">Please rotate your device to <strong>LANDSCAPE</strong>.</p>
        <div style="font-size: 80px; margin-top: 20px;">📱🔄</div>
    </div>

    <div id="game-container">
        <div id="help-icon" onclick="toggleInstructions(true)">?</div>
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay">
            <h1 id="overlay-title" class="zombie-font" style="color: #f00; font-size: 120px; margin: 0;">MISSION FAILED</h1>
            <p id="overlay-msg" style="color: #ccc; font-size: 32px; text-align: center; max-width: 80%;">The colony has fallen.</p>
            <button class="btn" onclick="initGame()">Try Again</button>
        </div>

        <div id="instructions-overlay" onclick="toggleInstructions(false)">
            <span class="close-help">×</span>
            <img id="instruction-img" src="https://christaylor-design.github.io/Dead_Reckoning/assets/Instruction%20board.png" alt="Survival Guide">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('ui-overlay');
        const instructionsOverlay = document.getElementById('instructions-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        // RESOLUTION SYNC: 2752 x 1536
        const UI_RES = { w: 2752, h: 1536 };

        const ASSETS = {
            bg: 'https://christaylor-design.github.io/Dead_Reckoning/assets/New%20background.png',
            cards: 'https://christaylor-design.github.io/Dead_Reckoning/Card%20board.png',
            runBtn: 'https://christaylor-design.github.io/Dead_Reckoning/assets/Run%20Button.png'
        };

        const CARD_SPRITES = {
            SCAVENGER: { row: 0, col: 0, suit: 'CLUBS' },
            AVOID:     { row: 0, col: 1, suit: 'HEARTS' },
            CLUBS:    { row: 0, col: 2, suit: 'CLUBS' }, 
            DIAMONDS:  { row: 1, col: 0, suit: 'DIAMONDS' }, 
            HEARTS:    { row: 1, col: 1, suit: 'HEARTS' }, 
            SPADES:    { row: 1, col: 2, suit: 'SPADES' }  
        };

        const state = {
            deck: [],
            scavengeArea: [null, null, null, null],
            inventory: [null, null],
            storage: null,
            pocket: null,
            playerHP: 20,
            shelterHP: 20,
            medsQuota: 0,
            medsTarget: 12,
            materialsQuota: 0,
            materialsTarget: 22,
            avoidsUsedThisHand: 0,
            runUsed: false,
            gameActive: false,
            draggingCard: null,
            dragOffset: { x: 0, y: 0 },
            mouse: { x: 0, y: 0 },
            imagesLoaded: false,
            logText: "Mission Start. Secure supplies.",
            logColor: "#0f0",
            radExposure: 3 
        };

        const UI = {
            scavengeSlots: [
                { x: 903, y: 519, w: 216, h: 293 },
                { x: 1202, y: 519, w: 216, h: 293 },
                { x: 1501, y: 519, w: 216, h: 293 },
                { x: 1803, y: 519, w: 216, h: 293 }
            ],
            inventorySlots: [
                { x: 343, y: 949, w: 211, h: 287 },
                { x: 646, y: 949, w: 211, h: 287 }
            ],
            actionSlots: [
                { x: 1151, y: 983, w: 267, h: 363, type: 'scavenger' }, 
                { x: 1547, y: 983, w: 267, h: 363, type: 'avoid' }
            ],
            storageSlot: { x: 2197, y: 949, w: 211, h: 287 },
            fixShelterSlot: { x: 2327, y: 519, w: 211, h: 287 },
            pocketSlot: { x: 186, y: 519, w: 192, h: 261 },
            discardSlot: { x: 83, y: 80, w: 211, h: 287 }, 
            helpScreen: { x: 482, y: 510, w: 327, h: 331 },
            runBtn: { x: 2471, y: 73, w: 194, h: 96 },
            bars: {
                player: { x: 529, y: 243, w: 950, h: 141, color: '#4a1', val: 'playerHP', max: 20, label: 'HEALTH' },
                shelter: { x: 1608, y: 243, w: 950, h: 141, color: '#26a', val: 'shelterHP', max: 20, label: 'SHELTER' }
            },
            text: {
                deck: { x: 1662, y: 113, w: 121, h: 56 },
                meds: { x: 1976, y: 86, w: 113, h: 64 },
                materials: { x: 2255, y: 86, w: 113, h: 64 }
            }
        };

        const imgBg = new Image();
        const imgCards = new Image();
        const imgRunBtn = new Image();
        let loadedCount = 0;

        function addLog(msg, isError = false) {
            state.logText = msg;
            state.logColor = isError ? '#f33' : '#0f0';
        }

        function toggleInstructions(show) {
            instructionsOverlay.style.display = show ? 'flex' : 'none';
        }

        function createDeck() {
            const deck = [];
            const suits = ['HEARTS', 'CLUBS', 'SPADES', 'DIAMONDS'];
            suits.forEach(suit => {
                const maxRank = (suit === 'CLUBS') ? 13 : 9;
                for (let i = 1; i <= maxRank; i++) {
                    deck.push({ ...CARD_SPRITES[suit], value: i, power: i, isSpecial: false, id: 'c-' + Math.random() });
                }
            });
            return shuffle(deck);
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function init() {
            resize(); 
            [imgBg, imgCards, imgRunBtn].forEach(img => img.crossOrigin = "anonymous");
            imgBg.onload = checkLoaded; imgBg.src = ASSETS.bg;
            imgCards.onload = checkLoaded; imgCards.src = ASSETS.cards;
            imgRunBtn.onload = checkLoaded; imgRunBtn.src = ASSETS.runBtn;

            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 200));

            canvas.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 1) handleStart(e.touches[0]); }, {passive: false});
            window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e.touches[0]); }, {passive: false});
            window.addEventListener('touchend', (e) => handleEnd(e.changedTouches[0] || e.touches[0]));
        }

        function checkLoaded() {
            loadedCount++;
            if (loadedCount === 3) {
                state.imagesLoaded = true;
                initGame();
                requestAnimationFrame(gameLoop);
            }
        }

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            let scale = Math.min(w / UI_RES.w, h / UI_RES.h);
            canvas.width = UI_RES.w;
            canvas.height = UI_RES.h;
            canvas.style.width = (UI_RES.w * scale) + 'px';
            canvas.style.height = (UI_RES.h * scale) + 'px';
        }

        function initGame() {
            state.deck = createDeck();
            state.playerHP = 20; state.shelterHP = 20;
            state.medsQuota = 0; state.materialsQuota = 0;
            state.inventory = [null, null];
            state.scavengeArea = [null, null, null, null];
            state.storage = null; state.pocket = null;
            state.runUsed = false; state.gameActive = true;
            uiOverlay.style.display = 'none';
            drawHand();
            addLog("Mission Start. Secure supplies.");
        }

        function checkGameOver() {
            if (state.playerHP <= 0 || state.shelterHP <= 0) {
                state.gameActive = false;
                overlayTitle.innerText = "MISSION FAILED";
                overlayMsg.innerText = "Dead. The wasteland claims all.";
                uiOverlay.style.display = 'flex';
                return true;
            }
            if (state.deck.length === 0 && state.scavengeArea.every(c => c === null)) {
                state.gameActive = false;
                const win = state.medsQuota >= state.medsTarget && state.materialsQuota >= state.materialsTarget;
                overlayTitle.innerText = win ? "MISSION SUCCESS" : "MISSION FAILED";
                overlayTitle.style.color = win ? "#0f0" : "#f60";
                overlayMsg.innerText = win ? "Thriving! Colony secured." : "Survived, but lacked supplies.";
                uiOverlay.style.display = 'flex';
                return true;
            }
            return false;
        }

        function drawHand() {
            state.avoidsUsedThisHand = 0;
            for (let i = 0; i < 4; i++) {
                if (state.scavengeArea[i] === null && state.deck.length > 0) state.scavengeArea[i] = state.deck.shift();
            }
            checkGameOver();
        }

        function checkTurnState() {
            if (state.scavengeArea.filter(c => c !== null).length <= 1) endHand();
        }

        function endHand() {
            if (state.storage) {
                if (state.storage.suit === 'HEARTS') state.medsQuota += state.storage.power;
                if (state.storage.suit === 'DIAMONDS') state.materialsQuota += state.storage.power;
                state.storage = null;
            }
            if (state.deck.length > 0) {
                state.playerHP -= state.radExposure;
                addLog(`Radiation spike: -${state.radExposure} HP.`);
            }
            if (!checkGameOver()) drawHand();
        }

        function drawCard(card, x, y, w, h, isDragging = false) {
            if (!card) return;
            const sw = 384, sh = 512;
            const sx = (card.col || 0) * sw;
            const sy = (card.row || 0) * sh;
            ctx.save();
            if (isDragging) { ctx.shadowBlur = 30; ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.globalAlpha = 0.9; }
            ctx.drawImage(imgCards, sx, sy, sw, sh, x, y, w, h);
            
            if (card.power !== undefined) {
                const fontSize = Math.floor(h * 0.12);
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.lineWidth = 6; 
                ctx.strokeStyle = "white"; 
                ctx.fillStyle = "#111";
                ctx.textBaseline = "middle";

                // Top Right Value (5% Inset)
                ctx.textAlign = "right";
                ctx.strokeText(card.power, x + w * 0.95, y + h * 0.05 + fontSize/2);
                ctx.fillText(card.power, x + w * 0.95, y + h * 0.05 + fontSize/2);

                // Bottom Left Value (5% Inset)
                ctx.textAlign = "left";
                ctx.strokeText(card.power, x + w * 0.05, y + h * 0.95 - fontSize/2);
                ctx.fillText(card.power, x + w * 0.05, y + h * 0.95 - fontSize/2);
            }
            ctx.restore();
        }

        function drawUI() {
            if (!state.imagesLoaded) return;
            ctx.drawImage(imgBg, 0, 0, UI_RES.w, UI_RES.h);
            
            ctx.textAlign = "center";
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#fff";
            ctx.font = "bold 36px monospace";
            ctx.fillText(state.deck.length, UI.text.deck.x + UI.text.deck.w/2, UI.text.deck.y + UI.text.deck.h/2 + 15);
            
            ctx.globalAlpha = 0.8;
            ctx.font = "bold 36px monospace";
            ctx.fillText(`${state.medsQuota}/${state.medsTarget}`, UI.text.meds.x + UI.text.meds.w/2, UI.text.meds.y + UI.text.meds.h/2 + 15);
            ctx.fillText(`${state.materialsQuota}/${state.materialsTarget}`, UI.text.materials.x + UI.text.materials.w/2, UI.text.materials.y + UI.text.materials.h/2 + 15);
            ctx.globalAlpha = 1;

            const box = UI.helpScreen;
            const padding = 20;
            const maxWidth = box.w - (padding * 2);
            const lineHeight = 35;
            let curY = box.y + 50;
            ctx.fillStyle = state.logColor; 
            ctx.font = "28px 'Courier New', monospace"; 
            ctx.textAlign = "left";
            const words = ("> " + state.logText).split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, box.x + padding, curY);
                    line = words[n] + ' ';
                    curY += lineHeight;
                } else {
                    line = testLine;
                }
                if (curY > box.y + box.h - padding) break;
            }
            if (curY <= box.y + box.h - padding) {
                ctx.fillText(line, box.x + padding, curY);
            }

            Object.values(UI.bars).forEach(b => {
                const val = state[b.val];
                const pct = Math.max(0, val / b.max);
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w * pct, b.h);
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = "#fff";
                ctx.font = "bold 56px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`${b.label}: ${Math.max(0, val)} / 20`, b.x + b.w/2, b.y + b.h/2 + 20);
            });
            ctx.globalAlpha = 1;

            if (state.runUsed) {
                ctx.drawImage(imgRunBtn, UI.runBtn.x, UI.runBtn.y, UI.runBtn.w, UI.runBtn.h);
            }

            UI.scavengeSlots.forEach((s, i) => drawCard(state.scavengeArea[i], s.x, s.y, s.w, s.h));
            UI.inventorySlots.forEach((s, i) => drawCard(state.inventory[i], s.x, s.y, s.w, s.h));
            drawCard(state.storage, UI.storageSlot.x, UI.storageSlot.y, UI.storageSlot.w, UI.storageSlot.h);
            drawCard(state.pocket, UI.pocketSlot.x, UI.pocketSlot.y, UI.pocketSlot.w, UI.pocketSlot.h);

            if (state.draggingCard) {
                const c = state.draggingCard.card;
                drawCard(c, state.mouse.x - state.dragOffset.x, state.mouse.y - state.dragOffset.y, 211, 287, true);
            }
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = UI_RES.w / rect.width;
            const scaleY = UI_RES.h / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        function handleStart(e) {
            if (!state.gameActive || instructionsOverlay.style.display === 'flex') return;
            const m = getEventPos(e); state.mouse = m;

            // Run Button Interaction
            if (m.x > UI.runBtn.x && m.x < UI.runBtn.x + UI.runBtn.w && m.y > UI.runBtn.y && m.y < UI.runBtn.y + UI.runBtn.h && !state.runUsed) {
                triggerRun();
                return;
            }

            UI.scavengeSlots.forEach((s, i) => {
                if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h && state.scavengeArea[i]) {
                    state.draggingCard = { card: state.scavengeArea[i], origin: 'scavenge', idx: i };
                    state.dragOffset = { x: m.x - s.x, y: m.y - s.y }; state.scavengeArea[i] = null;
                }
            });

            UI.inventorySlots.forEach((s, i) => {
                if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h && state.inventory[i]) {
                    state.draggingCard = { card: state.inventory[i], origin: 'inventory', idx: i };
                    state.dragOffset = { x: m.x - s.x, y: m.y - s.y }; state.inventory[i] = null;
                }
            });

            if (m.x > UI.storageSlot.x && m.x < UI.storageSlot.x + UI.storageSlot.w && m.y > UI.storageSlot.y && m.y < UI.storageSlot.y + UI.storageSlot.h && state.storage) {
                state.draggingCard = { card: state.storage, origin: 'storage' };
                state.dragOffset = { x: m.x - UI.storageSlot.x, y: m.y - UI.storageSlot.y }; state.storage = null;
            }

            if (m.x > UI.pocketSlot.x && m.x < UI.pocketSlot.x + UI.pocketSlot.w && m.y > UI.pocketSlot.y && m.y < UI.pocketSlot.y + UI.pocketSlot.h && state.pocket) {
                state.draggingCard = { card: state.pocket, origin: 'pocket' };
                state.dragOffset = { x: m.x - UI.pocketSlot.x, y: m.y - UI.pocketSlot.y }; state.pocket = null;
            }
        }

        function handleMove(e) { state.mouse = getEventPos(e); }

        function handleEnd(e) {
            if (!state.draggingCard) return;
            const m = state.mouse, card = state.draggingCard.card, origin = state.draggingCard.origin;
            let placed = false;

            // 1. COMBAT CHECK
            state.scavengeArea.forEach((target, i) => {
                const s = UI.scavengeSlots[i];
                if (target && target.suit === 'CLUBS' && card.suit === 'SPADES' && m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    if (origin !== 'scavenge') {
                        if (card.power >= target.power) { addLog("Zombie killed!"); state.scavengeArea[i] = null; }
                        else { target.power -= card.power; addLog("Zombie weakened."); }
                        placed = true;
                    } else addLog("Pick up weapon first!", true);
                }
            });

            // 2. DISCARD/SCRAP CHECK (Top Left)
            if (!placed && m.x > UI.discardSlot.x - 20 && m.x < UI.discardSlot.x + UI.discardSlot.w + 20 && m.y > UI.discardSlot.y - 20 && m.y < UI.discardSlot.y + UI.discardSlot.h + 20) {
                if (card.suit === 'CLUBS') {
                    addLog("You can't scrap a threat!", true);
                } else if (origin !== 'scavenge') {
                    addLog("Item scrapped.");
                    placed = true;
                } else {
                    addLog("Pick up item first!", true);
                }
            }

            // 3. ACTION SLOTS (Scavenger / Avoid)
            if (!placed) UI.actionSlots.forEach(s => {
                if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                    if (card.suit === 'DIAMONDS') {
                        addLog("Materials belong at the Shelter station!", true);
                    } else if (card.suit === 'SPADES') {
                        addLog("Weapons must be used directly on threats!", true);
                    } else {
                        if (s.type === 'scavenger') {
                            if (origin !== 'scavenge' && card.suit === 'HEARTS') { state.playerHP = Math.min(20, state.playerHP + card.power); placed = true; }
                        }
                        if (!placed && card.suit === 'CLUBS') {
                            if (s.type === 'scavenger') { state.playerHP -= card.power; placed = true; }
                            else if (s.type === 'avoid' && state.avoidsUsedThisHand < 1) { state.shelterHP -= 5; state.avoidsUsedThisHand++; placed = true; }
                        }
                    }
                }
            });

            // 4. FIX SHELTER STATION
            if (!placed && m.x > UI.fixShelterSlot.x && m.x < UI.fixShelterSlot.x + UI.fixShelterSlot.w && m.y > UI.fixShelterSlot.y && m.y < UI.fixShelterSlot.y + UI.fixShelterSlot.h) {
                if (origin !== 'scavenge' && card.suit === 'DIAMONDS') { state.shelterHP = Math.min(20, state.shelterHP + card.power); placed = true; }
                else if (card.suit !== 'DIAMONDS') addLog("Only materials fit here!", true);
                else addLog("Pick up materials first!", true);
            }

            // 5. POCKET (Special Cards Only)
            if (!placed && m.x > UI.pocketSlot.x && m.x < UI.pocketSlot.x + UI.pocketSlot.w && m.y > UI.pocketSlot.y && m.y < UI.pocketSlot.y + UI.pocketSlot.h && !state.pocket) {
                if (card.isSpecial) { state.pocket = card; placed = true; }
                else { addLog("Only unique items fit here!", true); }
            }

            // 6. INVENTORY & STORAGE
            if (!placed) {
                UI.inventorySlots.forEach((s, i) => {
                    if (m.x > s.x && m.x < s.x + s.w && m.y > s.y && m.y < s.y + s.h) {
                        if (card.suit === 'CLUBS') {
                            addLog("You don't want to hold hands with a zombie", true);
                        } else if (!state.inventory[i]) {
                            state.inventory[i] = card; placed = true;
                        }
                    }
                });
                
                if (!placed && m.x > UI.storageSlot.x && m.x < UI.storageSlot.x + UI.storageSlot.w && m.y > UI.storageSlot.y && m.y < UI.storageSlot.y + UI.storageSlot.h) {
                    if (card.suit === 'CLUBS') {
                        addLog("You don't want to hold hands with a zombie", true);
                    } else if (!state.storage) {
                        state.storage = card; placed = true;
                    }
                }
            }

            // 7. HEALTH BAR (Meds Shortcut)
            if (!placed && card.suit === 'HEARTS' && m.x > UI.bars.player.x && m.x < UI.bars.player.x + UI.bars.player.w && m.y > UI.bars.player.y && m.y < UI.bars.player.y + UI.bars.player.h && origin !== 'scavenge') {
                state.playerHP = Math.min(20, state.playerHP + card.power); placed = true;
            }

            if (!placed) {
                if (origin === 'scavenge') state.scavengeArea[state.draggingCard.idx] = card;
                else if (origin === 'inventory') state.inventory[state.draggingCard.idx] = card;
                else if (origin === 'storage') state.storage = card;
                else if (origin === 'pocket') state.pocket = card;
            } else if (!checkGameOver()) checkTurnState();
            state.draggingCard = null;
        }

        function triggerRun() {
            const currentScavenge = state.scavengeArea.filter(c => c !== null);
            if (currentScavenge.length === 0 && state.deck.length === 0) return;
            state.deck.push(...currentScavenge); shuffle(state.deck);
            state.scavengeArea = [null,null,null,null]; 
            state.runUsed = true; 
            addLog("Tactical retreat successful. You've escaped the encounter, but your energy is spent. No more running this mission.");
            drawHand();
        }

        function gameLoop() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, UI_RES.w, UI_RES.h);
            drawUI(); requestAnimationFrame(gameLoop);
        }
        window.onload = init;
    </script>
</body>
</html>
